<!DOCTYPE html> <!-- avisa ao navegador que é HTML5 -->
<html lang="pt-BR"> <!-- Idioma da página -->
<head>
  <meta charset="UTF-8"> <!-- faz acentos e "ç" aparecerem certos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <!-- "viewport" essencial para a página funcionar bem no celular -->
  <title>GoodMec - Veículos</title>
  <link rel="stylesheet" href="css/style.css">
   <!-- <link> do CSS no <head> e <script> do JS no final do <body>: é o padrão. O JS carrega por último para a página já existir quando ele rodar. -->
</head>
<body>

  <header>
  <!-- <header>, <nav>, <main>, <footer>: tags semânticas. Elas dizem o que cada bloco é, em vez de usar <div> para tudo. -->
    <h1>GoodMec</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="clientes.html">Clientes</a>
      <a href="veiculos.html">Veículos</a>
      <a href="ordens.html">Ordens de Serviço</a>
      <a href="orcamentos.html">Orçamentos</a>
      <a href="agenda.html">Agenda</a>
      <a href="pecas.html">Peças</a>
      <a href="relatorios.html">Relatórios</a>
    </nav>
  </header>

<main>
  <h2>Cadastro de Veículos</h2>

  <form id="form-veiculo">
    <label for="placa">Placa</label>
    <input type="text" id="placa" name="placa"
           maxlength="8" placeholder="ABC1D23"
           pattern="[A-Za-z]{3}-?[0-9][A-Za-z0-9][0-9]{2}"
           title="Use o formato ABC1234 ou ABC1D23" required>

    <label for="marca">Marca</label>
    <input type="text" id="marca" name="marca" required>

    <label for="modelo">Modelo</label>
    <input type="text" id="modelo" name="modelo" required>

    <label for="ano">Ano</label>
    <input type="number" id="ano" name="ano" min="1950" max="2100" required>

    <label for="quilometragem">Quilometragem (km)</label>
    <input type="number" id="quilometragem" name="quilometragem" min="0" required>

    <label for="cliente">Cliente</label>
    <select id="cliente" name="cliente" required>
      <option value="">Selecione um cliente</option>
      <!-- opções preenchidas pelo JavaScript -->
    </select>

    <button type="submit">Salvar veículo</button>
  </form>

  <h3>Veículos cadastrados</h3>
  <table id="tabela-veiculos">
    <thead>
      <tr>
        <th>Placa</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Ano</th>
        <th>Km</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- linhas criadas pelo JavaScript -->
    </tbody>
  </table>
</main>

<footer>
  <p>&copy; 2026 GoodMec. Projeto acadêmico.</p>
</footer>

  <script src="js/app.js"></script>
</body>
</html>
